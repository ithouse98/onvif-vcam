[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onvif-vcam"
version = "1.1.0"
authors = [{name = "Behrouz Kazemi (IPS-Co.)"}]
description = "ONVIF Profile S/T virtual camera: serve video files as discoverable ONVIF devices with RTSP streaming"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["onvif-zeep-async>=4"]

[project.scripts]
vcam = "vcam.__main__:run"

[tool.setuptools]
packages = ["vcam"]

[tool.setuptools.package-data]
vcam = ["web/*", "web/fonts/*", "web/assets/*"]
