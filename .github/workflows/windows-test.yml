name: Windows test
# Builds the portable bundle and runs it on a real Windows runner: file + screen-capture cameras,
# the three test suites, and a recording / snapshot of the screen camera. Results (text + images)
# are committed to the "ci-results" branch under <run id>/.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg zip bzip2
      - run: bash scripts/build_portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/*-Portable-win64.zip
          retention-days: 3
  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
      - name: Extract
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem *-Portable-win64.zip).FullName -DestinationPath C:\vc
          $root = (Get-ChildItem C:\vc -Directory)[0].FullName
          "ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory C:\results | Out-Null
      - name: GStreamer check / devices / probe
        timeout-minutes: 5
        shell: cmd
        run: |
          call "%ROOT%\_env.cmd"
          (
          "%PY%" -m vcam.gsthelper check
          "%PY%" -m vcam.gsthelper devices
          "%PY%" -m vcam.gsthelper probe screen://
          "%PY%" -m vcam.gsthelper probe screen://all
          "%PY%" -m vcam.gsthelper probe screen://0+0
          "%PY%" -m vcam.gsthelper probe "%ROOT%\videos\sample_1080p.mp4"
          ) > C:\results\gst-check.txt 2>&1
          type C:\results\gst-check.txt
          exit /b 0
      - name: Standalone, service, agent and tray tests
        timeout-minutes: 30
        shell: pwsh
        run: |
          # everything in one step: the runner kills processes left over when a step ends
          & "${{ github.workspace }}\scripts\windows_ci_test.ps1" -Root $env:ROOT
          Get-Content C:\results\summary.txt
          exit 0
      - name: Collect
        if: always()
        shell: pwsh
        run: |
          Remove-Item C:\results\*.mkv -ErrorAction SilentlyContinue
          Get-ChildItem C:\results | Format-Table Name, Length
      - name: Publish results to ci-results branch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          gh api "repos/$repo/branches/ci-results" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $sha = gh api "repos/$repo/git/refs/heads/${{ github.ref_name }}" -q .object.sha
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/ci-results -f sha=$sha | Out-Null
          }
          foreach ($f in Get-ChildItem C:\results -File) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            $body = @{ message = "ci results ${{ github.run_id }}: $($f.Name)"; content = $b64; branch = "ci-results" } | ConvertTo-Json
            $body | gh api -X PUT "repos/$repo/contents/${{ github.run_id }}/$($f.Name)" --input - | Out-Null
          }
