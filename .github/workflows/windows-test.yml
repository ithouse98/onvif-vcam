name: Windows test
# Builds the portable bundle and runs it on a real Windows runner: file + screen-capture cameras,
# the three test suites, and a recording / snapshot of the screen camera. Results (text + images)
# are committed to the "ci-results" branch under <run id>/.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg zip bzip2
      - run: bash scripts/build_portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/*-Portable-win64.zip
          retention-days: 3
  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
      - name: Extract
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem *-Portable-win64.zip).FullName -DestinationPath C:\vc
          $root = (Get-ChildItem C:\vc -Directory)[0].FullName
          "ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory C:\results | Out-Null
      - name: GStreamer check / devices / probe
        timeout-minutes: 5
        shell: cmd
        run: |
          call "%ROOT%\_env.cmd"
          (
          "%PY%" -m vcam.gsthelper check
          "%PY%" -m vcam.gsthelper devices
          "%PY%" -m vcam.gsthelper probe screen://
          "%PY%" -m vcam.gsthelper probe "%ROOT%\videos\sample_1080p.mp4"
          ) > C:\results\gst-check.txt 2>&1
          type C:\results\gst-check.txt
          exit /b 0
      - name: Run vcam (file + screen cameras), test suites, screen recording
        timeout-minutes: 25
        shell: pwsh
        run: |
          # one step: the runner kills processes left over when a step ends
          $env:PATH = "$env:ROOT\runtime;$env:ROOT\runtime\Library\bin;$env:PATH"
          $env:PYTHONPATH = "$env:ROOT\app"
          $PY = "$env:ROOT\runtime\python.exe"
          Start-Process -FilePath $PY -WorkingDirectory $env:ROOT `
            -ArgumentList "-m","vcam","$env:ROOT\videos\sample_1080p.mp4","screen://","--mjpeg","-c","$env:ROOT\config.json","--log-file","$env:ROOT\vcam.log" `
            -RedirectStandardOutput "C:\results\stdout.txt" -RedirectStandardError "C:\results\stderr.txt"
          for ($i = 0; $i -lt 60; $i++) {
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect("127.0.0.1", 8000); $c.Close(); break } catch { Start-Sleep 2 }
          }
          Start-Sleep 3
          $t = "C:\results\tests.txt"
          & $PY "$env:ROOT\app\tests\test_raw_soap.py" 127.0.0.1 8080 8554 admin admin *>> $t
          & $PY "$env:ROOT\app\tests\test_with_onvif_client.py" 127.0.0.1 8080 admin admin *>> $t
          & $PY "$env:ROOT\app\tests\test_panel.py" 127.0.0.1 8000 admin admin "$env:ROOT\videos\sample_1080p.mp4" *>> $t
          Select-String -Path $t -Pattern "passed|FAIL" | ForEach-Object { $_.Line }

          $null = Start-Job { 1..30 | ForEach-Object { Start-Process notepad; Start-Sleep 1 } }
          $out = "C:\results\screen.txt"
          foreach ($p in "Profile_1", "Profile_2") {
            $a = "-v error -timeout 20000000 -rtsp_transport tcp -i rtsp://admin:admin@127.0.0.1:8554/cam2/$p -t 10 -c copy -y C:\results\screen_$p.mkv"
            $pr = Start-Process ffmpeg -ArgumentList $a -NoNewWindow -PassThru -RedirectStandardError "C:\results\ff_$p.txt"
            if (-not $pr.WaitForExit(60000)) { $pr.Kill(); "ffmpeg $p TIMEOUT" | Add-Content $out }
            Get-Content "C:\results\ff_$p.txt" -ErrorAction SilentlyContinue | Add-Content $out
            & ffprobe -v error -count_frames -select_streams v -show_entries stream=codec_name,width,height,nb_read_frames -of compact "C:\results\screen_$p.mkv" 2>&1 | Add-Content $out
          }
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8081/onvif/snapshot/Profile_1.jpg -TimeoutSec 30 -OutFile C:\results\screen_snapshot.jpg; "snapshot ok" | Add-Content $out } catch { "snapshot failed: $_" | Add-Content $out }
          & ffmpeg -v error -ss 5 -i C:\results\screen_Profile_1.mkv -frames:v 1 -vf scale=960:-2 -y C:\results\screen_frame.jpg 2>&1 | Add-Content $out
          Get-Content $out
          exit 0
      - name: Collect
        if: always()
        shell: pwsh
        run: |
          Copy-Item "$env:ROOT\vcam.log" C:\results\ -ErrorAction SilentlyContinue
          Remove-Item C:\results\*.mkv -ErrorAction SilentlyContinue
          Get-ChildItem C:\results | Format-Table Name, Length
      - name: Publish results to ci-results branch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          gh api "repos/$repo/branches/ci-results" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $sha = gh api "repos/$repo/git/refs/heads/${{ github.ref_name }}" -q .object.sha
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/ci-results -f sha=$sha | Out-Null
          }
          foreach ($f in Get-ChildItem C:\results -File) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            $body = @{ message = "ci results ${{ github.run_id }}: $($f.Name)"; content = $b64; branch = "ci-results" } | ConvertTo-Json
            $body | gh api -X PUT "repos/$repo/contents/${{ github.run_id }}/$($f.Name)" --input - | Out-Null
          }
