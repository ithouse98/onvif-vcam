name: Android agent
# Builds the VCam Agent APK, tests it in the Android emulator against a VCam server on the runner
# (results to the ci-results branch) and optionally attaches it to a release.
on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the emulator end-to-end test"
        type: boolean
        default: true
      publish:
        description: "Attach the APK to the release below"
        type: boolean
        default: false
      tag:
        description: "Release tag to attach the APK to"
        default: "v1.4.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: |
          VER=$(grep versionName android/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p apk && cp android/app/build/outputs/apk/release/app-release.apk "apk/ONVIF-VCam-Agent-Android-$VER.apk"
          ls -la apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk
          retention-days: 7

  e2e:
    needs: build
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: VCam server (GStreamer from Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav ffmpeg
          mkdir -p /tmp/results
          echo '{"cameras": [], "ui_port": 8000}' > /tmp/vcam.json
          nohup /usr/bin/python3 -m vcam -c /tmp/vcam.json --log-file /tmp/results/vcam.log > /tmp/results/vcam-stdout.txt 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
          grep -E "engine|agent hub" /tmp/results/vcam.log
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          script: RES=/tmp/results bash scripts/android_e2e.sh
      - name: Publish results to ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=${{ github.repository }}
          gh api "repos/$repo/branches/ci-results" >/dev/null 2>&1 || \
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/ci-results -f sha=$(git rev-parse HEAD) >/dev/null
          for f in /tmp/results/*; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            sha=$(gh api "repos/$repo/contents/android-${{ github.run_id }}/$n?ref=ci-results" -q .sha 2>/dev/null || true)
            base64 -w0 "$f" > /tmp/b64
            jq -n --arg m "android ci ${{ github.run_id }}: $n" --rawfile c /tmp/b64 --arg b ci-results --arg s "$sha" \
              '{message:$m, content:$c, branch:$b} + (if $s != "" then {sha:$s} else {} end)' > /tmp/body.json
            gh api -X PUT "repos/$repo/contents/android-${{ github.run_id }}/$n" --input /tmp/body.json >/dev/null || echo "upload failed: $n"
          done

  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" apk/*.apk --clobber
          gh release edit "${{ inputs.tag }}" -F .github/release-notes.md
