name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg zip bzip2
      - run: bash scripts/build_portable.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          [[ "$TAG" == v* ]] || TAG=v$(python3 -c "import vcam;print(vcam.__version__)")
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "ONVIF VCam ${TAG#v}" -F .github/release-notes.md
          gh release upload "$TAG" dist/*-Portable-win64.zip --clobber
